name: .NET Core CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x # Or 8.0.x / 9.0.x depending on your target version

    # 1. Build shared core abstractions library
    - name: Build CQRS.Core
      run: dotnet build CQRS-ES/CQRS.Core/CQRS.Core.csproj --configuration Release

    # 2. Restore dependencies for the full SM-Post solution
    - name: Restore SM-Post Solution
      run: dotnet restore SM-Post/SM-Post.sln

    # 3. Build Post.Common, Post.Cmd, and Post.Query via solution
    - name: Build SM-Post Solution
      run: dotnet build SM-Post/SM-Post.sln --no-restore --configuration Release

    # 4. Run all tests across the solution
    - name: Test SM-Post Solution
      run: dotnet test SM-Post/SM-Post.sln --no-build --verbosity normal